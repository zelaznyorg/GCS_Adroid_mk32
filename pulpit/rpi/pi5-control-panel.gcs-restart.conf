# GCS — dokladka do uslugi PI5setup. Jej wlasny plik zostaje nietkniety.
#
# Panel jest JEDYNYM wlascicielem GPIO pokretla (linie sa zajmowane na
# wylacznosc). Kiedy jego proces ginie, pokretlo umiera calkowicie: nie
# dostaje nic ani panel, ani pulpit, ani stacja — a przy stanowisku nie ma
# myszy, wiec nie ma czym tego naprawic.
#
# ⛔ 2026-08-29 zdarzylo sie to naprawde. Proces zakonczyl sie z kodem 0,
# wiec przy fabrycznym Restart=on-failure systemd uznal to za poprawne
# zakonczenie i uslugi NIE wskrzesil. Pokretlo bylo martwe do reki.
[Service]
Restart=always
RestartSec=2
