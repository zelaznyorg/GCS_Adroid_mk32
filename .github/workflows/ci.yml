name: Kontrole

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: Android — testy i APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mk32app/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.4"
      - run: gradle :cockpit:testDebugUnitTest :cockpit:assembleDebug

  web:
    name: PWA — lint i build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mk32app/serwer/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mk32app/serwer/package-lock.json
            mk32app/serwer/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  python:
    name: Python — kontrola składni
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q tools mk32app/narzedzia
