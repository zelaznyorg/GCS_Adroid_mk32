name: Kontrola jakości

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Ustaw Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Testy jednostkowe
        run: python -m unittest discover -s tests -v

      - name: Składnia i nierozwiązane nazwy
        shell: bash
        run: |
          mapfile -t pliki < <(find pulpit narzedzia -type f -name '*.py' -print)
          python narzedzia/kontrola_nazw.py "${pliki[@]}"
          python narzedzia/kontrola_nazw.py pulpit/rpi/gcs-siec

      - name: Poprawność JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(f'ok {path}')
          PY

      - name: Składnia skryptów systemowych
        run: >-
          sh -n
          pulpit/rpi/instaluj.sh
          pulpit/rpi/gcs-otoczenie
          pulpit/rpi/gcs-sesja
          pulpit/rpi/gcs-ui
