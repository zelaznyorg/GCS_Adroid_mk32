<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- viewport-fit=cover wpuszcza stronę pod wcięcie ekranu; marginesy bezpieczne
         odbieramy z powrotem przez env(safe-area-inset-*) w App.css.
         user-scalable=no, bo w terenie szczypnięcie dwoma palcami po obrazie
         powiększało stronę, nie widok z kamery — i nie było jak wrócić. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#07090b" />

    <!-- Aplikacja na telefon: dok/TELEFON.md -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS nie czyta manifestu. Bez tych znaczników „Dodaj do ekranu
         początkowego" na iPhonie daje skrót otwierający Safari z paskiem adresu,
         a nie okno na pełnym ekranie. `mobile-web-app-capable` to wersja
         bez przedrostka — Chrome ostrzega w konsoli, gdy jej brakuje. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Panorama" />
    <link rel="apple-touch-icon" href="/ikona-180.png" />

    <title>Panorama — podgląd</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
