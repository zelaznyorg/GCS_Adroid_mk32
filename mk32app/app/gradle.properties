# 3 GB, nie 2: pelna rekompilacja modulu Compose po restarcie demona konczyla sie
# 2026-08-28 bledem OutOfMemoryError w kompilatorze Kotlina. Przebieg przyrostowy
# miescil sie w 2 GB, wiec objaw pojawial sie tylko po --stop albo czystym build.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
